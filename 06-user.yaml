- name: create user
  hosts:  user
  become: yes
  tasks:
    - name: disable nodejs
      command: dnf module disable nodejs -y
    
    - name: enable nodejs:24
      command:  dnf module enable nodejs:24 -y

    - name: install nodejs
      dnf:  
        name: nodejs
        state: present

    - name: create roboshop system user
      user:
        name: roboshop
        system: true
        create_home:  false
        home: /app
        shell:  /sbin/nologin
        comment:  "roboshop system user"

    - name: remove existing app directory
      file:
        path: /app
        state:  absent

    - name: remove user.zip
      file:
        path: /tmp/user.zip
        state:  absent
    
    - name: create app directory
      file:
        path: /app
        state: directory

    - name: download  user.zip
      get_url:
        url:  https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/user-v4.zip
        dest: /tmp/user.zip

    - name: unzip user.zip
      unarchive:
        src:  /tmp/user.zip
        dest: /app
        remote_src: yes

    - name: install dependencies
      community.general.npm: 
        path: /app        

    - name: copy user.service file
      template:
        src:  user.service.j2
        dest: /etc/systemd/system/user.service

    - name: daemon reload
      systemd_service:
        daemon_reload: true

    - name: start and enable user
      service:
        name: user
        state: restarted
        enabled: yes


