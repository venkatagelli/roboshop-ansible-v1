- name: create ec2 instances and r53 records
  hosts: local
  connection: local
  vars:
    instances: ["mongodb","redis","mysql","rabbitmq"]
    action: create
    domain_name: daws92s.sbs
    ami_id: ami-0055977a6e828a4f4
    instance_type: t3.micro
    region: us-east-1
  tasks:
    - name: create ec2 instance
      amazon.aws.ec2_instance:
        name: "roboshop.{{ item }}"
        instance_type: "{{ instance_type }}"
        image_id: "{{ ami_id }}"
        security_groups:
          - roboshop-common
          - "roboshop-{{ item }}"
        region: "{{ region }}"
      loop: "{{ instances }}"
      when: action == "create"
      register: ec2_output

    - name: print ec2_output
      debug:
        msg: "{{ ec2_output }}"

    - name: create R53 record
      amazon.aws.route53:
        state:  present
        zone:  "{{ domain_name }}"
        record: "{{ item.item}}.{{ domain_name }}" 
        type: A
        ttl:  1
        value:  "{{ item.instances[0].private_ip_address }}"
        overwrite: true
      loop: "{{ ec2_output.results}}"
      when: action == "create"

    - name: delete R53 record
      amazon.aws.route53:
        state:  absent
        zone:  "{{ domain_name }}"
        record: "{{ item}}.{{ domain_name }}" 
        type: A
        ttl:  1
      loop: "{{ instances }}"
      when: action == "delete"

    - name: delete ec2 instances
      amazon.aws.ec2_instance:
        state:  absent
        name: "roboshop.{{ item }}"
        region: "{{ region }}"
        wait: false
      loop: "{{ instances }}"
      when: action == "delete"




