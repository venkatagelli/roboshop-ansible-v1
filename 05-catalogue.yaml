- name: create catalogue
  hosts:  catalogue
  become: yes
  tasks:
    - name: disable nodejs
      command: dnf module disable nodejs -y
    
    - name: enable nodejs:24
      command:  dnf module enable nodejs:24 -y

    - name: install nodejs
      dnf:  
      name: nodejs
      state: present

    - name: create roboshop system user
      user:
        name: roboshop
        system: true
        create_home:  false
        home: /app
        shell:  /sbin/nologin
        comment:  "roboshop system user"
