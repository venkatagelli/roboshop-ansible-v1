- name: create catalogue
  hosts:  catalogue
  become: yes
  tasks:
    - name: disable nodejs
      command: dnf module disable nodejs -y
    
    - name: enable nodejs:24
      command:  dnf module enable nodejs:24 -y

    - name: install nodejs
      dnf:  
        name: nodejs
        state: present

    - name: create roboshop system user
      user:
        name: roboshop
        system: true
        create_home:  false
        home: /app
        shell:  /sbin/nologin
        comment:  "roboshop system user"

    - name: remove existing app directory
      file:
        path: /app
        state:  absent

    - name: remove catalogue.zip
      file:
        path: /tmp/catalogue.zip
        state:  absent
    
    - name: create app directory
      file:
        path: /app
        state: directory

    - name: download  catalogue.zip
      get_url:
        url:  https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/catalogue-v4.zip
        dest: /tmp/catalogue.zip

    - name: unzip catalogue.zip
      unarchive:
        src:  /tmp/catalogue.zip
        dest: /app

